# Weekly newsroom scan: a model searches the AG newsrooms for AI actions the
# registry does not list yet, and drafts each as a registry entry. The `scan`
# job is the only one that can call the Claude API and can only read this
# repository. It signs in by workload identity federation, which the `scan`
# environment's federation rule admits (its GitHub OIDC token, exchanged for a
# short-lived Anthropic token; `src/stateags/auth.py`), and holds no API key.
# It hands its candidates file to `propose`,
# which holds no secret, appends the drafts that pass the registry's checks, and
# opens a pull request for the maintainer. Nothing merges without the maintainer.
name: scan

on:
  schedule:
    - cron: "23 13 * * 1"   # Mondays 13:23 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest announcement date, YYYY-MM-DD (default 14 days ago)"
        required: false
        type: string
      states:
        description: "Comma-separated postal codes (default all 51)"
        required: false
        type: string

permissions: {}

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: scan
    permissions:
      contents: read
      # The Claude API sign-in: the OIDC token the federation rule exchanges.
      # Nothing else in this job uses it, but every step after it can request
      # one, which is why the job runs only pinned actions and locked
      # dependencies and the model's tools are server-side.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Scan the newsrooms
        env:
          # The federation identifiers are the environment's variables, not
          # secrets. The job names no API key: the scan signs in by federation
          # alone (src/stateags/auth.py).
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          SINCE: ${{ inputs.since }}
          STATES: ${{ inputs.states }}
        run: |
          set -euo pipefail
          args=(--out scan/candidates.json)
          if [ -n "${SINCE:-}" ]; then args+=(--since "$SINCE"); fi
          if [ -n "${STATES:-}" ]; then args+=(--states "$STATES"); fi
          uv run python -m stateags scan "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidates
          path: scan/candidates.json
          if-no-files-found: error

  propose:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidates
          path: scan
      - name: Append the drafts
        run: uv run python -m stateags apply-scan scan/candidates.json --body scan/pr-body.md
      # One branch and pull request per run. A run whose drafts all failed the
      # checks, or that found nothing, opens nothing.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/state-ags.yaml; then
            echo "No new drafts."
            cat scan/pr-body.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          branch="scan/${day}-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$branch"
          git add data/state-ags.yaml
          git commit -q -m "data: newsroom scan drafts for ${day}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "data: newsroom scan drafts for ${day}" --body-file scan/pr-body.md
          # A pull request opened with the workflow token starts no workflow
          # runs, so ci is dispatched on the branch to report the required check.
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
