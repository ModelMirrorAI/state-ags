# Lint, type-check and test every PR and every push to main. Read-only: nothing
# here writes to the repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      # The same build the board workflow publishes, so a registry edit that
      # names a case off fedcourtsai's AI watchlist fails here, before merge.
      - name: Fetch the AI watchlist
        run: >-
          curl --fail --silent --show-error --retry 3 -o "$RUNNER_TEMP/ai-watchlist.yaml"
          https://raw.githubusercontent.com/ModelMirrorAI/fedcourtsai/main/config/ai-watchlist.yaml
      - run: uv run python -m stateags build --watchlist "$RUNNER_TEMP/ai-watchlist.yaml" --out "$RUNNER_TEMP/board.json"
