# Rebuild board.json every day and publish it to the `board` branch, which the
# modelmirror.ai site fetches at build time. The board changes with no registry
# edit because the 730-day window slides and a successor takes office on a set
# day, so it is rebuilt on a schedule as well as on each push to main. The build
# job runs read-only; only the publish job can push, and only to `board`.
# The render job builds the modelmirror.ai site against the new board and
# screenshots the page's map as PNGs, which the publish job puts on `board`
# beside board.json, so each image has a stable link. A failed render never
# holds the board back: the board publishes and the images stay as they were.
# When the publish job pushes a changed board, the `site` job asks the
# modelmirror.ai rebuild workflow to redeploy the page with that board.
name: board

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Every case an action names must be on fedcourtsai's AI watchlist, read
      # from its main branch, so a case link the site renders resolves.
      - name: Fetch the AI watchlist
        run: >-
          curl --fail --silent --show-error --retry 3 -o "$RUNNER_TEMP/ai-watchlist.yaml"
          https://raw.githubusercontent.com/ModelMirrorAI/fedcourtsai/main/config/ai-watchlist.yaml
      - name: Build the board
        run: uv run python -m stateags build --watchlist "$RUNNER_TEMP/ai-watchlist.yaml" --out board/board.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board
          path: board/board.json
          if-no-files-found: error

  # Builds the site from modelmirror.ai's main with this run's board in place of
  # the published one, then screenshots the map (scripts/render). Read-only: it
  # checks out a public repository and uploads the images as an artifact.
  render:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ModelMirrorAI/modelmirror.ai
          ref: main
          path: site
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: board
          path: ${{ runner.temp }}/board
      - name: Build the site with this board
        working-directory: site
        env:
          STATE_AGS_BOARD: ${{ runner.temp }}/board/board.json
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install the renderer
        working-directory: scripts/render
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Render the map
        run: node scripts/render/render-map.mjs site/dist images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images/*.png
          if-no-files-found: error

  publish:
    needs: [build, render]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      board_sha: ${{ steps.push.outputs.board_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: board
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.render.result == 'success'
        with:
          name: images
          path: out/images
      # The branch holds board.json and the map images, one commit per change.
      # Files byte-identical to the published ones are not pushed, and the site
      # is asked to rebuild only when board.json itself changed.
      - name: Publish to the board branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 "$url" board 2>/dev/null; then
            git checkout -q -b board FETCH_HEAD
          else
            git checkout -q --orphan board
          fi
          cp ../out/board.json board.json
          git add board.json
          board_changed=true
          if git diff --cached --quiet; then
            board_changed=false
          fi
          if [ -d ../out/images ]; then
            cp ../out/images/*.png .
            git add -- *.png
          else
            echo "The render failed, so the published images stay as they were."
          fi
          if git diff --cached --quiet; then
            echo "Board and images unchanged."
            exit 0
          fi
          git commit -q -m "board: rebuild from ${SOURCE_SHA}"
          git push -q "$url" board
          if [ "$board_changed" = true ]; then
            echo "board_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Dispatches the site's rebuild workflow, which waits until the raw file host
  # serves this board and then redeploys. The token is a secret of the
  # `site-dispatch` environment, which accepts only `main`; it is scoped to
  # running Actions on modelmirror.ai and reaches nothing in this repository.
  site:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.board_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: site-dispatch
    steps:
      - name: Dispatch the site rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          BOARD_SHA: ${{ needs.publish.outputs.board_sha }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "SITE_DISPATCH_TOKEN secret is not set"; exit 1; }
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ModelMirrorAI/modelmirror.ai/actions/workflows/rebuild.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"board_sha\":\"$BOARD_SHA\"}}"
          echo "Asked modelmirror.ai to rebuild with board $BOARD_SHA."
