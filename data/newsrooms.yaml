# The newsroom domains `python -m stateags scan` searches for each office (one
# or more hosts per state and DC). A shared state portal (www.in.gov, www.mass.gov,
# www.michigan.gov, www.maine.gov, www.tn.gov, portal.ct.gov) is searched whole, and
# the scan's prompt names the attorney general's office so other agencies' releases
# are passed over. `shared` hosts carry multistate letters and are searched with every batch.
shared:
- www.naag.org
offices:
